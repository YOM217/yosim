name: Generate fresh openers

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: opener-generator
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate fresh openers
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
        run: node scripts/generate-openers.mjs

      - name: Commit updated feed
        run: |
          if git diff --quiet -- openers-feed.json; then
            echo "No feed changes"
            exit 0
          fi
          git config user.name "opener-bot"
          git config user.email "actions@users.noreply.github.com"
          git add openers-feed.json
          git commit -m "Auto-refresh opener feed"
          git push
