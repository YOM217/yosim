<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080810">
<title>פתיחות PRO — Preview</title>
<style>
:root{--bg:#080810;--card:#11111d;--soft:#171727;--text:#f7f7fb;--muted:#87879b;--line:rgba(255,255,255,.08);--red:#f04468;--orange:#ff9b42;--blue:#4fc7ff;--green:#60d394;--gold:#ffcf5c}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,rgba(240,68,104,.16),transparent 28%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}.app{max-width:760px;margin:auto;padding:24px 16px 48px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.brand b{font-size:24px;background:linear-gradient(135deg,var(--red),var(--orange));-webkit-background-clip:text;color:transparent}.brand small{display:block;color:var(--muted);margin-top:4px}.pill{border:1px solid var(--line);background:var(--soft);color:var(--text);border-radius:999px;padding:9px 12px;font-size:12px}.hero{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 20px 55px rgba(0,0,0,.32)}.newbar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:rgba(79,199,255,.08);border:1px solid rgba(79,199,255,.2);border-radius:16px;padding:11px 13px;margin-bottom:14px;color:#dff6ff}.newbar strong{color:var(--blue)}.filters{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}.filters select,.filters input{width:100%;border:1px solid var(--line);background:#0d0d17;color:var(--text);border-radius:14px;padding:11px 12px;outline:none}.card{min-height:230px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;justify-content:space-between}.meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px}.opener{font-size:28px;line-height:1.55;text-align:center;font-weight:750;margin:28px 8px}.source{font-size:12px;color:var(--muted);text-align:center}.actions{display:grid;grid-template-columns:1.5fr 1fr 56px 56px;gap:8px;margin-top:12px}.btn{border:1px solid var(--line);background:var(--soft);color:var(--text);border-radius:15px;padding:14px 10px;font-weight:700;cursor:pointer}.btn.primary{background:linear-gradient(135deg,var(--red),#b72c4a);border:0}.btn.fav.active{color:var(--gold);border-color:rgba(255,207,92,.35);background:rgba(255,207,92,.08)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.stat{background:var(--soft);border:1px solid var(--line);border-radius:15px;padding:11px}.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:var(--muted)}.tabs{display:flex;gap:8px;overflow:auto;margin-top:20px}.tab{white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:9px 13px}.tab.active{color:white;background:var(--soft)}.panel{margin-top:12px;display:grid;gap:8px}.row{display:flex;align-items:center;gap:10px;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:11px 12px}.rowtext{flex:1;line-height:1.45}.mini{border:1px solid var(--line);background:#0c0c15;color:white;border-radius:10px;padding:7px 10px}.empty{text-align:center;color:var(--muted);padding:22px}.footer{color:var(--muted);font-size:11px;line-height:1.7;text-align:center;margin-top:18px}.badge{display:inline-block;border-radius:999px;padding:3px 8px;font-size:10px;background:rgba(96,211,148,.09);color:var(--green);border:1px solid rgba(96,211,148,.22)}
@media(max-width:560px){.app{padding-top:16px}.opener{font-size:23px}.filters{grid-template-columns:1fr}.actions{grid-template-columns:1.35fr 1fr 52px 52px}.stats{grid-template-columns:1fr 1fr}.brand b{font-size:21px}}
</style>
</head>
<body><main class="app">
<div class="top"><div class="brand"><b>⚡ פתיחות PRO</b><small id="contextLine">מנוע פתיחות חכם</small></div><div class="pill">PREVIEW v1</div></div>
<section class="hero">
<div class="newbar"><span>נוצרו עבורך מאז הביקור האחרון</span><strong id="newCount">0 חדשים</strong></div>
<div class="filters"><select id="category"><option value="all">הכול</option><option value="קליל">קליל</option><option value="מסקרן">מסקרן</option><option value="עמוק">עמוק</option><option value="מצחיק">מצחיק</option><option value="רגעי">לפי הרגע</option></select><input id="search" placeholder="חפש פתיחה..." /></div>
<div class="card"><div class="meta"><span id="catLabel">קטגוריה</span><span id="freshLabel" class="badge">חדש</span></div><div id="opener" class="opener">טוען...</div><div id="source" class="source"></div></div>
<div class="actions"><button class="btn primary" id="nextBtn">הבא</button><button class="btn" id="copyBtn">העתק</button><button class="btn fav" id="favBtn" title="מועדף">★</button><button class="btn" id="deleteBtn" title="מחיקה קבועה">🗑</button></div>
<div class="stats"><div class="stat"><b id="totalStat">0</b><span>פתיחות זמינות</span></div><div class="stat"><b id="favStat">0</b><span>מועדפים</span></div><div class="stat"><b id="deletedStat">0</b><span>נחסמו</span></div><div class="stat"><b id="seenStat">0</b><span>נראו</span></div></div>
</section>
<div class="tabs"><button class="tab active" data-tab="history">אחרונות</button><button class="tab" data-tab="favorites">מועדפים</button><button class="tab" data-tab="deleted">חסומים</button></div><div id="panel" class="panel"></div>
<div class="footer">ה־Preview שומר הכול במכשיר שלך בלבד. פתיחות חדשות נבנות אוטומטית לפי תאריך, שעה והקשר כללי. אין מפתח AI חשוף ואין תלות בשרת חיצוני.</div>
</main>
<script>
const K={fav:'xtp_fav_v1',del:'xtp_del_v1',seen:'xtp_seen_v1',hist:'xtp_hist_v1',last:'xtp_last_v1'};
const load=(k,d=[])=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let fav=load(K.fav),del=load(K.del),seen=load(K.seen),hist=load(K.hist),tab='history',current=null;
const base=[
['קליל','שאלה קטנה לפתיחה: מה הדבר הכי טוב שקרה לך השבוע?'],['קליל','יש לי תחושה שיש לך תשובה טובה לזה: מה תמיד משפר לך את היום?'],['קליל','מה יותר את/ה — קפה שקט או תוכנית ספונטנית?'],['מסקרן','איזו דעה שלך בדרך כלל מפתיעה אנשים?'],['מסקרן','מה משהו קטן שמספר על בן אדם יותר ממה שחושבים?'],['מסקרן','אם הייתי נותן לך לבחור נושא אחד לשיחה בלי סמול טוק — מה היית בוחר/ת?'],['עמוק','מה הדבר שלמדת לאחרונה ושינה לך קצת את הדרך להסתכל על אנשים?'],['עמוק','מה יותר חשוב בעיניך בשיחה טובה — כנות, הומור או סקרנות?'],['עמוק','איזה רגע קטן אתה זוכר הרבה יותר ממה שהיית מצפה?'],['מצחיק','שאלה חשובה ברמת ביטחון לאומי: אננס על פיצה — כן או משפט?'],['מצחיק','בוא/י נבדוק תאימות בסיסית: מתכננים הכול או זורמים ואז מאלתרים?'],['מצחיק','מה הכישרון הכי לא שימושי אבל מרשים שיש לך?']];
const starts=['שאלה בלי הכנה מוקדמת:','מסקרן אותי לדעת:','ניסוי קטן בשיחה:','שאלה של מצב רוח:','במקום עוד היי רגיל:','נלך ישר למעניין:'];
const topics=['מה הדבר שהכי קל לגרום לך לחייך ממנו?','איזה מקום תמיד עושה לך טוב?','מה היית רוצה לדעת לעשות ממש טוב?','איזו החלטה ספונטנית יצאה לך הכי מוצלחת?','מה הדבר האחרון שלמדת רק מתוך סקרנות?','מה מבחינתך הופך שיחה רגילה לשיחה ששווה לזכור?','אם היום היה מקבל כותרת — מה היא הייתה?','מה משהו שאנשים בדרך כלל מניחים עליך ולא קולעים?'];
function daySeed(){const d=new Date();return Number(`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`)}
function rand(seed){let x=Math.sin(seed)*10000;return x-Math.floor(x)}
function contextual(){const d=new Date(),h=d.getHours(),day=d.getDay();let a=[];if(h<11)a.push(['רגעי','שאלת בוקר: מה הדבר הראשון שיכול להפוך את היום הזה לטוב?']);else if(h<17)a.push(['רגעי','שאלת אמצע יום: אם היית יכול/ה לעצור הכול לשעה — מה היית עושה?']);else a.push(['רגעי','שאלת ערב: מה היה החלק הכי טוב ביום שלך עד עכשיו?']);if(day===5||day===6)a.push(['רגעי','סוף שבוע זה מבחן אופי קטן: שקט מוחלט או לצאת ולעשות משהו?']);else a.push(['רגעי','באמצע שבוע דווקא מעניין: מה מחזיק לך את האנרגיה כשעוד יש דרך עד הסופ״ש?']);return a}
function generated(){const seed=daySeed(),out=[];for(let i=0;i<18;i++){const s=starts[Math.floor(rand(seed+i*17)*starts.length)],t=topics[Math.floor(rand(seed+i*31)*topics.length)],cat=['קליל','מסקרן','עמוק'][Math.floor(rand(seed+i*47)*3)];out.push([cat,`${s} ${t}`])}return out}
function all(){const map=new Map();[...base,...contextual(),...generated()].forEach(([c,t])=>{if(!map.has(t))map.set(t,{cat:c,text:t,id:btoa(unescape(encodeURIComponent(t))).slice(0,24)})});return [...map.values()].filter(x=>!del.includes(x.id))}
function filtered(){let q=document.getElementById('search').value.trim(),c=document.getElementById('category').value;return all().filter(x=>(c==='all'||x.cat===c)&&(!q||x.text.includes(q)))}
function pick(next=true){const arr=filtered();if(!arr.length){current=null;renderCard();return}let pool=arr.filter(x=>!seen.includes(x.id));if(!pool.length)pool=arr;let i=Math.floor(Math.random()*pool.length);current=pool[i];if(!seen.includes(current.id)){seen.push(current.id);save(K.seen,seen)}hist=hist.filter(x=>x.id!==current.id);hist.unshift(current);hist=hist.slice(0,12);save(K.hist,hist);renderCard();renderPanel();updateStats()}
function renderCard(){const o=document.getElementById('opener');if(!current){o.textContent='לא נמצאו פתיחות לפי הסינון';document.getElementById('catLabel').textContent='—';document.getElementById('source').textContent='';return}o.textContent=current.text;document.getElementById('catLabel').textContent=current.cat;document.getElementById('source').textContent=current.cat==='רגעי'?'מותאם לזמן הנוכחי':'נוצר מתוך מאגר ומנוע וריאציות';document.getElementById('favBtn').classList.toggle('active',fav.includes(current.id));document.getElementById('freshLabel').style.visibility=seen.includes(current.id)?'hidden':'visible'}
function updateStats(){document.getElementById('totalStat').textContent=all().length;document.getElementById('favStat').textContent=fav.length;document.getElementById('deletedStat').textContent=del.length;document.getElementById('seenStat').textContent=seen.length}
function toggleFav(){if(!current)return;fav=fav.includes(current.id)?fav.filter(x=>x!==current.id):[current.id,...fav];save(K.fav,fav);renderCard();renderPanel();updateStats()}
function blockCurrent(){if(!current)return;if(!del.includes(current.id))del.push(current.id);fav=fav.filter(x=>x!==current.id);save(K.del,del);save(K.fav,fav);pick()}
function copyText(t){navigator.clipboard?.writeText(t).then(()=>flash('הועתק')).catch(()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();flash('הועתק')})}
function flash(t){const el=document.getElementById('copyBtn'),old=el.textContent;el.textContent=t;setTimeout(()=>el.textContent=old,900)}
function renderPanel(){const p=document.getElementById('panel');let arr=[];if(tab==='history')arr=hist.filter(x=>!del.includes(x.id));if(tab==='favorites')arr=all().filter(x=>fav.includes(x.id));if(tab==='deleted'){arr=load(K.del).map(id=>({id,text:'פתיחה חסומה',cat:'חסום'}));const remembered=[...base,...contextual(),...generated()].map(([cat,text])=>({cat,text,id:btoa(unescape(encodeURIComponent(text))).slice(0,24)}));arr=arr.map(x=>remembered.find(r=>r.id===x.id)||x)}if(!arr.length){p.innerHTML='<div class="empty">אין פריטים כאן עדיין</div>';return}p.innerHTML=arr.map(x=>`<div class="row"><div class="rowtext"><b>${x.cat}</b><br>${x.text}</div>${tab==='deleted'?`<button class="mini" data-restore="${x.id}">שחזר</button>`:`<button class="mini" data-copy="${encodeURIComponent(x.text)}">העתק</button>`}</div>`).join('');p.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyText(decodeURIComponent(b.dataset.copy)));p.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>{del=del.filter(x=>x!==b.dataset.restore);save(K.del,del);renderPanel();updateStats()})}
function initNew(){const last=Number(localStorage.getItem(K.last)||0),today=daySeed(),count=last===today?0:generated().length+contextual().length;document.getElementById('newCount').textContent=`${count} חדשים`;localStorage.setItem(K.last,today)}
function contextText(){const d=new Date(),h=d.getHours(),days=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];document.getElementById('contextLine').textContent=`יום ${days[d.getDay()]} · ${h<12?'בוקר':h<18?'צהריים':'ערב'} · מנוע אוטונומי פעיל`}
document.getElementById('nextBtn').onclick=()=>pick();document.getElementById('copyBtn').onclick=()=>current&&copyText(current.text);document.getElementById('favBtn').onclick=toggleFav;document.getElementById('deleteBtn').onclick=blockCurrent;document.getElementById('category').onchange=()=>pick();document.getElementById('search').oninput=()=>pick();document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;renderPanel()});
contextText();initNew();updateStats();renderPanel();pick();
</script></body></html>
