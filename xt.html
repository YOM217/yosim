<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090910">
<title>פתיחות PRO</title>
<style>
:root{--bg:#090910;--card:#12121d;--soft:#191927;--line:rgba(255,255,255,.09);--text:#f8f8fb;--muted:#8e8ea2;--pink:#ef476f;--orange:#ff9f43;--blue:#56ccf2;--green:#66d19e;--gold:#ffd166}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,rgba(239,71,111,.16),transparent 30%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;min-height:100vh}button,input,select{font:inherit}.app{max-width:760px;margin:auto;padding:18px 14px 42px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.brand b{font-size:23px;background:linear-gradient(135deg,var(--pink),var(--orange));-webkit-background-clip:text;color:transparent}.brand small{display:block;color:var(--muted);margin-top:4px}.live{font-size:11px;border:1px solid rgba(102,209,158,.25);color:var(--green);background:rgba(102,209,158,.07);padding:8px 10px;border-radius:999px}.hero{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015));border-radius:24px;padding:16px;box-shadow:0 18px 55px rgba(0,0,0,.3)}.freshbar{display:flex;justify-content:space-between;gap:10px;align-items:center;background:rgba(86,204,242,.08);border:1px solid rgba(86,204,242,.2);border-radius:15px;padding:10px 12px;margin-bottom:12px;color:#e1f8ff;font-size:13px}.freshbar strong{color:var(--blue)}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.filters select,.filters input{width:100%;border:1px solid var(--line);background:#0e0e17;color:white;border-radius:13px;padding:11px 12px;outline:none}.card{min-height:245px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;justify-content:space-between}.meta{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted)}.counter{font-weight:800;color:white}.opener{font-size:27px;line-height:1.58;text-align:center;font-weight:760;margin:24px 4px}.source{text-align:center;color:var(--muted);font-size:11px}.actions{display:grid;grid-template-columns:52px 1.5fr 1.5fr 52px 52px;gap:8px;margin-top:10px}.btn{border:1px solid var(--line);background:var(--soft);color:white;border-radius:14px;padding:13px 8px;font-weight:750}.btn.primary{background:linear-gradient(135deg,var(--pink),#b92f50);border:0}.btn.fav.active{color:var(--gold);border-color:rgba(255,209,102,.34);background:rgba(255,209,102,.08)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.stat{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:10px}.stat b{display:block;font-size:18px}.stat span{font-size:10px;color:var(--muted)}.tabs{display:flex;gap:8px;overflow:auto;margin-top:18px}.tab{white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:8px 12px}.tab.active{background:var(--soft);color:white}.panel{margin-top:10px;display:grid;gap:8px}.row{display:flex;gap:8px;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:13px;padding:10px}.rowtext{flex:1;line-height:1.45}.mini{border:1px solid var(--line);background:#0d0d15;color:white;border-radius:9px;padding:7px 9px}.empty{text-align:center;color:var(--muted);padding:20px}.foot{font-size:11px;color:var(--muted);text-align:center;line-height:1.6;margin-top:15px}.badge{display:inline-block;border-radius:999px;padding:3px 7px;font-size:10px;background:rgba(102,209,158,.08);color:var(--green);border:1px solid rgba(102,209,158,.2)}
@media(max-width:560px){.opener{font-size:23px}.filters{grid-template-columns:1fr}.actions{grid-template-columns:48px 1fr 1fr 48px 48px}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><main class="app">
<div class="top"><div class="brand"><b>פתיחות PRO</b><small id="contextLine">מנוע פתיחות אוטונומי</small></div><div class="live">LIVE · מקומי</div></div>
<section class="hero">
<div class="freshbar"><span>נוספו בכניסה הזאת</span><strong id="freshCount">0 חדשים</strong></div>
<div class="filters"><select id="category"><option value="all">הכול</option><option value="קליל">קליל</option><option value="מסקרן">מסקרן</option><option value="עמוק">עמוק</option><option value="מצחיק">מצחיק</option><option value="רגעי">לפי הרגע</option></select><input id="search" placeholder="חפש במאגר..." /></div>
<div class="card"><div class="meta"><span id="catLabel">קטגוריה</span><span class="counter" id="position">0 מתוך 0</span></div><div id="opener" class="opener">טוען...</div><div class="source"><span id="freshBadge" class="badge">חדש</span> <span id="source">נוצר במנוע המקומי</span></div></div>
<div class="actions"><button class="btn" id="prevBtn">‹</button><button class="btn primary" id="nextBtn">הבא</button><button class="btn" id="copyBtn">העתק</button><button class="btn fav" id="favBtn">★</button><button class="btn" id="deleteBtn">🗑</button></div>
<div class="stats"><div class="stat"><b id="totalStat">0</b><span>במאגר</span></div><div class="stat"><b id="favStat">0</b><span>מועדפים</span></div><div class="stat"><b id="deletedStat">0</b><span>חסומים</span></div><div class="stat"><b id="seenStat">0</b><span>נראו</span></div></div>
</section>
<div class="tabs"><button class="tab active" data-tab="history">אחרונות</button><button class="tab" data-tab="favorites">מועדפים</button><button class="tab" data-tab="deleted">חסומים</button></div><div id="panel" class="panel"></div>
<div class="foot">המאגר גדל בכל פתיחה של העמוד. המשפטים נשמרים במכשיר, ולכן משפטים חדשים מתווספים על הישנים. אין תלות בשרת AI או במפתח חיצוני.</div>
</main>
<script>
const K={pool:'op_pool_v4',fav:'op_fav_v4',del:'op_del_v4',seen:'op_seen_v4',hist:'op_hist_v4',visit:'op_visit_v4'};
const load=(k,d=[])=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const hash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)};
const pick=a=>a[Math.floor(Math.random()*a.length)];
let pool=load(K.pool),fav=load(K.fav),del=load(K.del),seen=load(K.seen),hist=load(K.hist),tab='history',current=null,index=0,freshIds=[];
const seeds=[
['קליל','שאלה קטנה לפתיחה: מה הדבר הכי טוב שקרה לך השבוע?'],['קליל','מה תמיד מצליח לשפר לך את היום?'],['קליל','מה יותר מתאים לך — יום מתוכנן או משהו ספונטני?'],['מסקרן','איזו דעה שלך בדרך כלל מפתיעה אנשים?'],['מסקרן','מה משהו קטן שמספר הרבה על בן אדם?'],['מסקרן','אם אפשר לדלג על סמול טוק — על מה היית רוצה לדבר?'],['עמוק','מה הדבר שלמדת לאחרונה ושינה לך קצת את נקודת המבט?'],['עמוק','מה הופך שיחה רגילה לשיחה שבאמת זוכרים?'],['עמוק','איזה רגע קטן נשאר אצלך בזיכרון יותר ממה שציפית?'],['מצחיק','שאלה חשובה: אננס על פיצה — כן או ממש לא?'],['מצחיק','מתכננים הכול מראש או זורמים ואז מאלתרים?'],['מצחיק','מה הכישרון הכי לא שימושי אבל משעשע שיש לך?']
];
const starts=['שאלה בלי הכנה מוקדמת:','במקום עוד היי רגיל:','נלך ישר למעניין:','מסקרן אותי לדעת:','שאלה של מצב רוח:','ניסוי קטן בשיחה:','שאלה קצת אחרת:','משהו שתמיד מעניין לשמוע:','בלי תשובה נכונה או לא נכונה:','שאלה אקראית אבל טובה:'];
const cores=[
'מה הדבר שהכי קל לגרום לך לחייך ממנו?','איזה מקום תמיד עושה לך טוב?','מה היית רוצה לדעת לעשות ממש טוב?','איזו החלטה ספונטנית יצאה לך הכי מוצלחת?','מה הדבר האחרון שלמדת רק מתוך סקרנות?','מה מבחינתך הופך שיחה לטובה באמת?','אם היום היה מקבל כותרת — מה היא הייתה?','מה משהו שאנשים בדרך כלל מניחים עליך ולא תמיד קולעים?','איזה דבר קטן יכול לשנות לך מצב רוח?','מה מסוג הדברים שאף פעם לא נמאס לך לדבר עליהם?','איזה יום בשבוע הכי מתאים לאופי שלך ולמה?','מה הדבר הראשון שהיית עושה אם היה לך יום פנוי לגמרי?','איזה הרגל קטן עושה לך סדר בראש?','מה לדעתך אנשים מעריכים פחות ממה שמגיע לו?','איזה נושא יכול לגרום לך לשכוח מהשעה?','מה היה הדבר הכי מעניין שראית או שמעת לאחרונה?','אם אפשר היה ללמוד משהו חדש בשנייה — מה היית בוחר?','מה יותר חשוב לך: שקט, צחוק או עניין?','איזה מקום בארץ תמיד שווה ביקור נוסף מבחינתך?','מה הופך יום רגיל ליום מוצלח מבחינתך?'
];
const tails=['',' בלי לחשוב יותר מדי.',' תשובה ראשונה שעולה לך.',' אפשר גם תשובה מפתיעה.',' אין פה תשובה נכונה.',' דווקא התשובה הקטנה מעניינת.'];
const altStarts=['מעניין אותי משהו:','בוא נבדוק משהו קטן:','יש לי שאלה טובה:','בא לי להתחיל דווקא מזה:','נשמע לי יותר מעניין לשאול:'];
const altCores=['מה גרם לך לאחרונה להגיד "וואלה, לא ציפיתי לזה"?','איזה דבר קטן תמיד מצליח להצחיק אותך?','מה היית מעדיף לקבל עכשיו — שעה חופשית או רעיון טוב?','איזה נושא תמיד מקבל אצלך יותר מדי זמן מחשבה?','מה הדבר הכי נחמד שאפשר לעשות בלי לתכנן מראש?','איזו המלצה טובה קיבלת לאחרונה?','מה מבחינתך סימן ששיחה באמת זורמת?','איזה משהו חדש היית מוכן לנסות רק מתוך סקרנות?','אם היית צריך לבחור מילה אחת ליום שלך — מה היא?','מה יותר מתאים לך כרגע — קפה, הליכה או שיחה טובה?'];
function contextPieces(){const d=new Date(),h=d.getHours(),day=d.getDay(),m=d.getMonth()+1;let arr=[];if(h<11)arr.push('שאלת בוקר: מה יכול להפוך את היום הזה לטוב כבר מההתחלה?');else if(h<17)arr.push('שאלת אמצע יום: אם היית יכול לעצור הכול לשעה — מה היית עושה?');else arr.push('שאלת ערב: מה היה החלק הכי טוב ביום שלך עד עכשיו?');if(day===5||day===6)arr.push('סוף שבוע: יותר מתאים לך שקט מוחלט או לצאת ולעשות משהו?');else arr.push('באמצע שבוע: מה נותן לך אנרגיה להמשיך עד הסופ״ש?');if([6,7,8].includes(m))arr.push('קיץ ישראלי: ים, מזגן או לילה בחוץ?');if([12,1,2].includes(m))arr.push('חורף: גשם בחוץ או ערב רגוע בבית?');return arr}
function add(cat,text,origin='מנוע מקומי'){text=text.replace(/\s+/g,' ').trim();if(!text)return false;let id=hash(text);if(pool.some(x=>x.id===id)||del.includes(id))return false;pool.push({id,cat,text,origin,created:Date.now()});freshIds.push(id);return true}
function bootstrap(){if(!pool.length){seeds.forEach(([c,t])=>add(c,t,'גרעין איכות'))}}
function generateBatch(n=24){let made=0,tries=0;contextPieces().forEach(t=>{if(add('רגעי',t,'זמן והקשר'))made++});while(made<n&&tries<n*40){tries++;let style=Math.random()<.55;let s=style?pick(starts):pick(altStarts);let c=style?pick(cores):pick(altCores);let t=Math.random()<.7?pick(tails):'';let cat=pick(['קליל','מסקרן','עמוק','מצחיק']);let text=`${s} ${c}${t}`;if(add(cat,text))made++}if(pool.length>1200)pool=pool.slice(-1200);save(K.pool,pool);return made}
function activePool(){return pool.filter(x=>!del.includes(x.id))}
function filtered(){let q=document.getElementById('search').value.trim().toLowerCase(),c=document.getElementById('category').value;return activePool().filter(x=>(c==='all'||x.cat===c)&&(!q||x.text.toLowerCase().includes(q)))}
function ensureIndex(arr){if(!arr.length){index=0;return}if(index<0)index=arr.length-1;if(index>=arr.length)index=0}
function show(dir=0){let arr=filtered();if(!arr.length){current=null;document.getElementById('opener').textContent='אין משפטים במסנן הזה';document.getElementById('position').textContent='0 מתוך 0';return}if(dir)index+=dir;ensureIndex(arr);current=arr[index];document.getElementById('opener').textContent=current.text;document.getElementById('catLabel').textContent=current.cat;document.getElementById('position').textContent=`${index+1} מתוך ${arr.length}`;document.getElementById('source').textContent=current.origin||'מנוע מקומי';document.getElementById('freshBadge').style.display=freshIds.includes(current.id)?'inline-block':'none';if(!seen.includes(current.id)){seen.push(current.id);save(K.seen,seen)}hist=hist.filter(x=>x.id!==current.id);hist.unshift(current);hist=hist.slice(0,30);save(K.hist,hist);document.getElementById('favBtn').classList.toggle('active',fav.includes(current.id));stats();renderPanel()}
function stats(){document.getElementById('totalStat').textContent=activePool().length;document.getElementById('favStat').textContent=fav.length;document.getElementById('deletedStat').textContent=del.length;document.getElementById('seenStat').textContent=seen.length}
function renderPanel(){let p=document.getElementById('panel'),items=[];if(tab==='history')items=hist.filter(x=>!del.includes(x.id));if(tab==='favorites')items=activePool().filter(x=>fav.includes(x.id));if(tab==='deleted')items=pool.filter(x=>del.includes(x.id));if(!items.length){p.innerHTML='<div class="empty">אין פריטים כאן עדיין</div>';return}p.innerHTML=items.slice(0,40).map(x=>`<div class="row"><div class="rowtext">${x.text}</div><button class="mini" data-id="${x.id}" data-act="use">הצג</button>${tab==='deleted'?`<button class="mini" data-id="${x.id}" data-act="restore">שחזר</button>`:''}</div>`).join('');p.querySelectorAll('button').forEach(b=>b.onclick=()=>{let id=b.dataset.id;if(b.dataset.act==='restore'){del=del.filter(x=>x!==id);save(K.del,del);stats();renderPanel();return}let arr=filtered(),i=arr.findIndex(x=>x.id===id);if(i>=0){index=i;show(0)}})}
function refreshContext(){let h=new Date().getHours();document.getElementById('contextLine').textContent=h<11?'בוקר טוב · המאגר ממשיך לגדול':h<18?'צהריים · המאגר ממשיך לגדול':'ערב · המאגר ממשיך לגדול'}
bootstrap();const made=generateBatch(24);save(K.visit,Date.now());document.getElementById('freshCount').textContent=`${made} חדשים`;refreshContext();stats();show(0);
document.getElementById('nextBtn').onclick=()=>show(1);document.getElementById('prevBtn').onclick=()=>show(-1);
document.getElementById('copyBtn').onclick=async()=>{if(!current)return;try{await navigator.clipboard.writeText(current.text);document.getElementById('copyBtn').textContent='הועתק';setTimeout(()=>document.getElementById('copyBtn').textContent='העתק',900)}catch{}};
document.getElementById('favBtn').onclick=()=>{if(!current)return;fav=fav.includes(current.id)?fav.filter(x=>x!==current.id):[current.id,...fav];save(K.fav,fav);show(0)};
document.getElementById('deleteBtn').onclick=()=>{if(!current)return;let id=current.id;if(!del.includes(id))del.push(id);fav=fav.filter(x=>x!==id);save(K.del,del);save(K.fav,fav);index=Math.max(0,index-1);show(0)};
document.getElementById('category').onchange=()=>{index=0;show(0)};document.getElementById('search').oninput=()=>{index=0;show(0)};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;renderPanel()});
</script></body></html>
