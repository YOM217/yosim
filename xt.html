<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07070f">
<title>פתיחות PRO · LIVE</title>
<style>
:root{--bg:#07070f;--surface:#0f1020;--card:#151628;--card2:#1b1d32;--text:#f6f7fb;--muted:#8b90a7;--line:rgba(255,255,255,.08);--pink:#ef3f6c;--orange:#ff9f43;--blue:#44c7ff;--green:#39d98a;--safe:env(safe-area-inset-bottom,18px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body{padding-bottom:calc(24px + var(--safe))}.wrap{max-width:720px;margin:auto}.top{position:sticky;top:0;z-index:20;padding:45px 18px 12px;background:linear-gradient(var(--bg) 78%,rgba(7,7,15,.94));backdrop-filter:blur(10px)}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:900;font-size:22px;background:linear-gradient(135deg,var(--pink),var(--orange));-webkit-background-clip:text;color:transparent}.sub{font-size:10px;color:var(--muted);letter-spacing:1.6px;margin-top:2px}.icons{display:flex;gap:8px}.ib{position:relative;width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--surface);color:white;font-size:18px}.badge{position:absolute;left:-4px;top:-5px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--pink);font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:800}.live{margin:10px 18px 12px;padding:12px 14px;border-radius:16px;background:linear-gradient(135deg,rgba(57,217,138,.12),rgba(68,199,255,.08));border:1px solid rgba(57,217,138,.25);display:flex;justify-content:space-between;gap:10px;align-items:center}.live strong{font-size:13px}.live small{display:block;color:var(--muted);margin-top:3px;font-size:10px}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green);display:inline-block;margin-left:6px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:0 18px 12px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}.stat b{display:block;font-size:17px}.stat span{font-size:9px;color:var(--muted)}.cats{display:flex;gap:7px;overflow:auto;padding:0 18px 12px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}.cat{white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:25px;padding:8px 13px;font-size:12px;font-weight:700}.cat.on{background:linear-gradient(135deg,var(--pink),#b92749);color:white;border-color:transparent}.cardbox{padding:0 18px}.card{position:relative;min-height:250px;border-radius:25px;padding:40px 25px 62px;background:linear-gradient(145deg,#17182b,#111220);border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.42);display:flex;align-items:center;justify-content:center}.ribbon{position:absolute;top:0;right:0;left:0;height:3px;border-radius:25px 25px 0 0;background:linear-gradient(90deg,var(--pink),var(--orange))}.meta{position:absolute;top:15px;right:18px;font-size:10px;color:var(--blue);font-weight:800}.quality{position:absolute;top:15px;left:18px;font-size:10px;color:var(--muted)}#text{font-size:25px;line-height:1.55;font-weight:800;text-align:center;letter-spacing:-.3px}.hint{position:absolute;bottom:16px;right:18px;left:18px;text-align:center;color:#555a73;font-size:10px}.actions{display:grid;grid-template-columns:1fr 1.8fr 1fr 1fr;gap:7px;padding:12px 18px}.btn{border:1px solid var(--line);background:var(--surface);color:white;border-radius:15px;padding:15px 7px;font-weight:800;font-size:13px}.next{background:linear-gradient(135deg,var(--pink),#bb294a);border:none;box-shadow:0 7px 24px rgba(239,63,108,.28)}.fav.on{color:#ffd55a;background:rgba(255,213,90,.09)}.section{padding:12px 18px 7px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:1.2px}.list{padding:0 18px;display:flex;flex-direction:column;gap:8px}.row{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:12px 13px}.rowtxt{flex:1;font-size:13px;line-height:1.45}.mini{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:white}.empty{padding:18px;text-align:center;color:var(--muted);font-size:12px}.sheetBg{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:flex-end;z-index:100}.sheetBg.open{display:flex}.sheet{width:100%;max-height:80vh;overflow:auto;background:var(--card2);border-radius:26px 26px 0 0;padding:16px 18px calc(24px + var(--safe));border-top:1px solid var(--line)}.sheet h3{margin:2px 0 12px}.sheet .close{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:white;font-weight:800;margin-top:12px}.toast{position:fixed;bottom:calc(28px + var(--safe));left:50%;transform:translate(-50%,30px);opacity:0;background:#202238;color:white;border:1px solid var(--line);padding:11px 20px;border-radius:30px;font-size:12px;transition:.25s;z-index:200}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:380px){#text{font-size:22px}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="head"><div><div class="brand">פתיחות PRO · LIVE</div><div class="sub">מנוע אוטונומי · מתחדש בכל פתיחה</div></div><div class="icons"><button class="ib" onclick="openSheet('fav')">★<span id="favBadge" class="badge">0</span></button><button class="ib" onclick="openSheet('trash')">🗑<span id="trashBadge" class="badge">0</span></button></div></div></div>
  <div class="live"><div><strong><span class="dot"></span><span id="newMsg">נוצרו משפטים חדשים</span></strong><small id="contextMsg"></small></div><div style="font-size:20px">∞</div></div>
  <div class="stats"><div class="stat"><b id="sNew">0</b><span>חדשים בפתיחה</span></div><div class="stat"><b id="sPool">0</b><span>זמינים עכשיו</span></div><div class="stat"><b id="sFav">0</b><span>מועדפים</span></div><div class="stat"><b id="sSeen">0</b><span>כבר הוצגו</span></div></div>
  <div id="cats" class="cats"></div>
  <div class="cardbox"><div class="card" onclick="next()"><div class="ribbon"></div><div id="catMeta" class="meta"></div><div id="quality" class="quality">טבעי · לא מתאמץ</div><div id="text"></div><div class="hint">לחץ על הכרטיס למשפט הבא</div></div></div>
  <div class="actions"><button id="favBtn" class="btn fav" onclick="toggleFav(event)">☆</button><button class="btn next" onclick="next(event)">הבא</button><button class="btn" onclick="copyCurrent(event)">העתק</button><button class="btn" onclick="blockCurrent(event)">מחק</button></div>
  <div class="section">האחרונים שהשתמשת בהם</div><div id="history" class="list"></div>
</div>
<div id="sheetBg" class="sheetBg" onclick="bgClose(event)"><div class="sheet"><h3 id="sheetTitle"></h3><div id="sheetList"></div><button class="close" onclick="closeSheet()">סגור</button></div></div>
<div id="toast" class="toast"></div>
<script>
const K={fav:'op_fav_v3',blocked:'op_blocked_v3',seen:'op_seen_v3',hist:'op_hist_v3',session:'op_session_v3'};
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch{return d}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let favorites=load(K.fav,[]), blocked=load(K.blocked,[]), seen=load(K.seen,[]), history=load(K.hist,[]);
let current=null,filter='הכל',sessionPool=[],sessionNew=0;
const cats=['הכל','טבעי','חכם','סקרן','קליל','עמוק','מחמאה','עונתי','מועדפים'];
const openings={
'טבעי':['יש משהו בדרך שבה את מציגה את עצמך שגרם לי לעצור. מה הסיפור מאחורייך?','אני בדרך כלל לא מתחיל בשאלון, אז נלך על משהו אמיתי: מה עושה לך שבוע טוב?','קפצת לי לעין בלי יותר מדי רעש. מה הדבר שהכי קל לדבר איתך עליו?','יש לך וייב של מישהי עם סיפור מעניין. צדקתי או שאני ממציא?'],
'חכם':['מה גילית בשנים האחרונות ששינה לך לגמרי דעה על אנשים?','איזו תכונה את מעריכה יותר ככל שאת מתבגרת?','מה לדעתך אנשים מבינים מאוחר מדי על קשרים?','אם היית יכולה לשמור רק עיקרון אחד לחיים, מה הוא היה?'],
'סקרן':['מה הדבר הכי לא צפוי שמצליח להוציא ממך חיוך?','איזה מקום תמיד מצליח לאפס אותך?','מה היה הדבר האחרון שסיקרן אותך באמת?','מה אנשים כמעט תמיד מנחשים עלייך לא נכון?'],
'קליל':['שאלה חשובה לפתיחת שיחה: קפה טוב או אוכל טוב?','אני צריך הכרעה: ספונטניות זה כיף או כאב ראש?','מה יותר את: ערב שקט או תוכנית שנולדה שעה קודם?','מה הסיכוי שיש לך המלצה אחת טובה שתגנוב לי את הערב?'],
'עמוק':['מה גורם לך להרגיש שמישהו באמת מקשיב לך?','איזה סוג של שיחה גורם לך לשכוח מהשעה?','מה מבחינתך הופך היכרות רגילה לחיבור אמיתי?','איזה דבר קטן אומר לך הרבה על בן אדם?'],
'מחמאה':['אהבתי שיש בפרופיל שלך משהו רגוע ולא מתאמץ. זה גם באופי?','יש לך נוכחות מעניינת בלי לנסות יותר מדי. הייתי חייב לשאול מה מסתתר מאחוריה.','החיוך תפס את העין, אבל יותר סיקרן אותי האופי שמאחוריו.','נראית לי מישהי שקל להתחיל איתה שיחה טובה, אז בדקתי את התיאוריה.']
};
const starts=['מסקרן אותי לדעת','שאלה לא שגרתית','בואי נתחיל בלי קלישאות','אני מעדיף שיחה אמיתית, אז','משהו קטן שסיקרן אותי','במקום עוד “מה נשמע”,'];
const cores=['מה גורם לך להרגיש שהיום היה שווה את זה?','מה הדבר שאת יכולה לדבר עליו בלי לשים לב לזמן?','איזו תכונה גורמת לך לתת למישהו עוד דקה של שיחה?','מה היה הדבר הכי טוב שקרה לך לאחרונה בלי שתכננת?','מה גורם לך לבחור להמשיך שיחה עם מישהו?','איזה הרגל קטן עושה לך סדר בראש?','מה מבחינתך הופך יום רגיל ליום טוב?','איזה סוג הומור תמיד קונה אותך?','מה את מעריכה אצל אנשים מהר מאוד?','מה הדבר האחרון שלמדת במקרה והפתיע אותך?'];
const tails=['',' אני באמת סקרן.',' בלי תשובה מושלמת.',' תשובה ראשונה שעולה לראש.',' יש לי תחושה שהתשובה אומרת הרבה.'];
function ctx(){let d=new Date(),h=d.getHours(),day=d.getDay(),m=d.getMonth()+1;let part=h<12?'בוקר':h<17?'צהריים':h<22?'ערב':'לילה';let season=(m>=3&&m<=5)?'אביב':(m>=6&&m<=8)?'קיץ':(m>=9&&m<=11)?'סתיו':'חורף';return{d,h,day,m,part,season,dateKey:d.toISOString().slice(0,10)}}
function seasonal(c){let a=[];if(c.part==='בוקר')a.push('שאלת בוקר קטנה: מה הדבר הראשון שיכול להפוך לך יום רגיל ליום טוב?');if(c.part==='ערב'||c.part==='לילה')a.push('שאלת ערב: מה היה הרגע הכי טוב שלך היום, אפילו אם הוא היה קטן?');if(c.day===5||c.day===6)a.push('סוף שבוע הוא מבחן אופי קטן: לנוח באמת או למלא אותו בתוכניות?');if(c.season==='קיץ')a.push('קיץ תמיד חושף העדפות: ים, מזגן או בריחה למקום שקט?');if(c.season==='חורף')a.push('בחורף אני תמיד מגלה מי באמת אוהב בית: ערב בפנים או דווקא לצאת?');if(c.season==='סתיו')a.push('יש משהו בתקופה הזאת שמזמין שינוי. יש משהו חדש שבא לך להתחיל?');if(c.season==='אביב')a.push('אביב תמיד מרגיש כמו ריסט קטן. מה היית שמחה לרענן בתקופה הזאת?');return a.map(txt=>({txt,cat:'עונתי',q:'מתאים לזמן'}))}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function seededOrder(arr,seed){return [...arr].sort((a,b)=>hash(seed+a.txt)-hash(seed+b.txt))}
function generate(){let c=ctx(),pool=[];Object.entries(openings).forEach(([cat,list])=>list.forEach(txt=>pool.push({txt,cat,q:'נבחר ידנית'})));for(let i=0;i<starts.length;i++)for(let j=0;j<cores.length;j++)for(let k=0;k<tails.length;k++){let txt=(starts[i]+' '+cores[j]+tails[k]).replace(/\s+/g,' ').trim();pool.push({txt,cat:j%3===0?'חכם':j%3===1?'סקרן':'טבעי',q:'חדש מהמנוע'})}pool.push(...seasonal(c));let uniq=new Map();pool.forEach(x=>uniq.set(x.txt,x));pool=[...uniq.values()].filter(x=>!blocked.includes(x.txt));pool=seededOrder(pool,c.dateKey+'|'+Date.now()+'|'+Math.random());let fresh=pool.filter(x=>!seen.includes(x.txt));sessionNew=fresh.length;sessionPool=[...fresh,...pool.filter(x=>seen.includes(x.txt))];if(sessionPool.length===0){seen=[];save(K.seen,seen);return generate()}return c}
function available(){let a=filter==='מועדפים'?sessionPool.filter(x=>favorites.includes(x.txt)):filter==='הכל'?sessionPool:sessionPool.filter(x=>x.cat===filter);return a.length?a:sessionPool}
function next(e){if(e)e.stopPropagation();let a=available().filter(x=>!current||x.txt!==current.txt);if(!a.length)a=available();current=a[Math.floor(Math.random()*a.length)];if(!seen.includes(current.txt)){seen.push(current.txt);if(seen.length>3000)seen=seen.slice(-2500);save(K.seen,seen)}render();}
function render(){if(!current)return;document.getElementById('text').textContent=current.txt;document.getElementById('catMeta').textContent=current.cat;document.getElementById('quality').textContent=current.q||'טבעי';let on=favorites.includes(current.txt);let b=document.getElementById('favBtn');b.textContent=on?'★':'☆';b.classList.toggle('on',on);stats();}
function stats(){document.getElementById('sNew').textContent=sessionNew;document.getElementById('sPool').textContent=sessionPool.length;document.getElementById('sFav').textContent=favorites.length;document.getElementById('sSeen').textContent=seen.length;document.getElementById('favBadge').textContent=favorites.length;document.getElementById('trashBadge').textContent=blocked.length;}
function toggleFav(e){e.stopPropagation();if(!current)return;let i=favorites.indexOf(current.txt);if(i>=0){favorites.splice(i,1);toast('הוסר מהמועדפים')}else{favorites.unshift(current.txt);toast('נשמר במועדפים')}save(K.fav,favorites);render();}
function blockCurrent(e){e.stopPropagation();if(!current)return;if(!blocked.includes(current.txt))blocked.push(current.txt);favorites=favorites.filter(x=>x!==current.txt);save(K.blocked,blocked);save(K.fav,favorites);sessionPool=sessionPool.filter(x=>x.txt!==current.txt);toast('נמחק ולא יופיע שוב');next();}
async function copyCurrent(e){e.stopPropagation();if(!current)return;try{await navigator.clipboard.writeText(current.txt)}catch{let ta=document.createElement('textarea');ta.value=current.txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}history.unshift({txt:current.txt,cat:current.cat,t:Date.now()});history=history.slice(0,8);save(K.hist,history);renderHistory();toast('הועתק')}
function renderHistory(){let el=document.getElementById('history');if(!history.length){el.innerHTML='<div class="empty">עוד לא השתמשת במשפטים</div>';return}el.innerHTML=history.slice(0,4).map((x,i)=>`<div class="row"><div class="rowtxt">${esc(x.txt)}</div><button class="mini" onclick="copyText(${i})">⧉</button></div>`).join('')}
async function copyText(i){let t=history[i].txt;try{await navigator.clipboard.writeText(t)}catch{}toast('הועתק')}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function buildCats(){document.getElementById('cats').innerHTML=cats.map(c=>`<button class="cat ${c===filter?'on':''}" onclick="setCat('${c}')">${c}</button>`).join('')}
function setCat(c){filter=c;buildCats();next()}
function openSheet(type){let list=document.getElementById('sheetList');document.getElementById('sheetBg').classList.add('open');if(type==='fav'){document.getElementById('sheetTitle').textContent='מועדפים';if(!favorites.length){list.innerHTML='<div class="empty">אין מועדפים עדיין</div>';return}list.innerHTML=favorites.map((t,i)=>`<div class="row"><div class="rowtxt">${esc(t)}</div><button class="mini" onclick="useFav(${i})">⧉</button><button class="mini" onclick="removeFav(${i})">✕</button></div>`).join('')}else{document.getElementById('sheetTitle').textContent='נמחקו ולא יחזרו';if(!blocked.length){list.innerHTML='<div class="empty">אין משפטים חסומים</div>';return}list.innerHTML=blocked.map((t,i)=>`<div class="row"><div class="rowtxt">${esc(t)}</div><button class="mini" onclick="restore(${i})">↶</button></div>`).join('')}}
function useFav(i){navigator.clipboard&&navigator.clipboard.writeText(favorites[i]);toast('הועתק מהמועדפים')}
function removeFav(i){favorites.splice(i,1);save(K.fav,favorites);openSheet('fav');stats()}
function restore(i){blocked.splice(i,1);save(K.blocked,blocked);generate();openSheet('trash');stats();toast('שוחזר')}
function closeSheet(){document.getElementById('sheetBg').classList.remove('open')}function bgClose(e){if(e.target.id==='sheetBg')closeSheet()}
let tt;function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1500)}
(function init(){let c=generate();buildCats();renderHistory();document.getElementById('newMsg').textContent='+'+sessionNew+' משפטי פתיחה חדשים זמינים';document.getElementById('contextMsg').textContent=`מותאם ל${c.part} · ${c.season} · ${new Intl.DateTimeFormat('he-IL',{weekday:'long',day:'numeric',month:'long'}).format(c.d)}`;next();stats()})();
</script>
</body>
</html>
