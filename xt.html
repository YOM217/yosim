<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#09090c">
<title>פתיחות PRO</title>
<style>
:root{
  --bg:#09090c;--panel:#111116;--card:#17171e;--soft:#1d1d25;--line:rgba(255,255,255,.08);
  --text:#f7f7fa;--muted:#8d8d9a;--accent:#ff3b6b;--accent2:#ff7a45;--good:#4cd59b;--gold:#ffd166;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif}
body{background:radial-gradient(circle at 80% -10%,rgba(255,59,107,.12),transparent 28%),var(--bg)}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:720px;margin:auto;padding:16px 14px 32px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.brand{min-width:0}
.brand b{display:block;font-size:22px;line-height:1;font-weight:850;letter-spacing:-.4px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;color:transparent}
.brand small{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.topTools{display:flex;align-items:center;gap:6px}
.toolBtn{height:38px;border:1px solid var(--line);background:var(--soft);color:#fff;border-radius:12px;padding:0 11px;font-size:12px;font-weight:750;white-space:nowrap}
.toolBtn.refreshing{opacity:.78;pointer-events:none}
.toolBtn.refreshing .refreshIcon{display:inline-block;animation:spin .65s linear infinite}
.version{font-size:9px;color:var(--good);border:1px solid rgba(76,213,155,.18);background:rgba(76,213,155,.06);padding:6px 7px;border-radius:999px}
@keyframes spin{to{transform:rotate(360deg)}}

.hero{background:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,.012));border:1px solid var(--line);border-radius:22px;padding:12px}
.statusRow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-bottom:8px}
.bank{display:flex;align-items:center;gap:7px;min-width:0}
.bank strong{font-size:15px}
.bank span{font-size:10px;color:var(--muted)}
.state{font-size:10px;color:var(--good);background:rgba(76,213,155,.07);border:1px solid rgba(76,213,155,.16);padding:6px 8px;border-radius:999px;white-space:nowrap}

.filters{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:9px}
.filters select,.filters input{width:100%;height:42px;border:1px solid var(--line);background:#0d0d12;color:#fff;border-radius:12px;padding:0 11px;outline:none}
.filters input{font-size:16px}

.card{min-height:190px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px;display:flex;flex-direction:column;justify-content:space-between}
.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:10px}
.counter{color:#fff;font-weight:750}
.opener{text-align:center;font-size:25px;line-height:1.48;font-weight:780;letter-spacing:-.2px;margin:15px 4px}
.source{text-align:center;color:var(--muted);font-size:9px}
.badge{display:inline-block;color:var(--good);border:1px solid rgba(76,213,155,.2);background:rgba(76,213,155,.06);border-radius:999px;padding:2px 6px}

.primaryActions{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:7px;margin-top:9px}
.secondaryActions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:7px}
.btn{height:46px;border:1px solid var(--line);border-radius:13px;background:var(--soft);color:#fff;font-weight:780;padding:0 8px}
.btn.primary{border:0;background:linear-gradient(135deg,var(--accent),#b52e52)}
.btn.reject{background:rgba(255,59,107,.06);border-color:rgba(255,59,107,.24)}
.btn.fav{border-color:rgba(255,209,102,.18)}
.btn.fav.active{color:var(--gold);background:rgba(255,209,102,.08);border-color:rgba(255,209,102,.35)}
.btn.utility{height:38px;font-size:11px;color:#d9d9df;background:#14141a}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:9px}
.stat{background:#121218;border:1px solid var(--line);border-radius:11px;padding:7px 5px;text-align:center}
.stat b{display:block;font-size:15px}
.stat span{font-size:8px;color:var(--muted)}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.tab{height:36px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:11px;font-size:11px;font-weight:700}
.tab.active{background:var(--soft);color:#fff}
.panel{margin-top:7px;display:grid;gap:5px}
.row{display:flex;align-items:center;gap:6px;background:#121218;border:1px solid var(--line);border-radius:11px;padding:8px}
.rowtext{flex:1;min-width:0;font-size:12px;line-height:1.35}
.mini{border:1px solid var(--line);background:#0c0c11;color:#fff;border-radius:8px;padding:6px 7px;font-size:10px}
.empty{text-align:center;color:var(--muted);font-size:11px;padding:12px}
.foot{text-align:center;color:var(--muted);font-size:10px;margin-top:12px}

.toast{position:fixed;z-index:50;left:50%;top:max(16px,env(safe-area-inset-top));transform:translate(-50%,-12px);opacity:0;pointer-events:none;background:#f5f5f7;color:#111;border-radius:14px;padding:10px 14px;font-size:12px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:.2s ease;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:560px){
  html,body{height:100%;overflow:hidden}
  .app{height:100dvh;max-height:100dvh;padding:max(8px,env(safe-area-inset-top)) 8px max(7px,env(safe-area-inset-bottom));display:flex;flex-direction:column;overflow:hidden}
  .top{margin-bottom:6px;flex:0 0 auto}
  .brand b{font-size:19px}.brand small{font-size:9px;margin-top:2px}
  .topTools{gap:4px}.toolBtn{height:34px;padding:0 8px;font-size:10px;border-radius:10px}.version{display:none}
  .hero{padding:8px;border-radius:17px;flex:0 0 auto}
  .statusRow{margin-bottom:6px}.bank strong{font-size:13px}.bank span{font-size:8px}.state{font-size:8px;padding:5px 7px}
  .filters{gap:5px;margin-bottom:6px}.filters select,.filters input{height:36px;padding:0 8px;border-radius:10px}
  .card{height:145px;min-height:145px;padding:9px 10px;border-radius:15px}
  .opener{font-size:clamp(18px,5.4vw,22px);line-height:1.3;margin:6px 1px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .source{font-size:8px}.meta{font-size:9px}
  .primaryActions{gap:5px;margin-top:6px}.btn{height:40px;border-radius:11px;font-size:11px}.btn.primary{font-size:13px}
  .secondaryActions{gap:5px;margin-top:5px}.btn.utility{height:32px;font-size:10px}
  .stats{gap:4px;margin-top:5px}.stat{padding:4px 2px;border-radius:9px}.stat b{font-size:13px}.stat span{font-size:7px}
  .tabs{gap:4px;margin-top:5px}.tab{height:31px;font-size:10px;border-radius:9px}
  .panel{flex:1;min-height:0;overflow-y:auto;margin-top:4px;gap:4px;-webkit-overflow-scrolling:touch}.row{padding:6px;border-radius:9px}.rowtext{font-size:10px}.mini{padding:5px 6px;font-size:9px}
  .foot{display:none}
}
@media(max-width:560px) and (max-height:720px){
  .brand small{display:none}
  .top{margin-bottom:4px}.toolBtn{height:30px;font-size:9px}
  .statusRow{margin-bottom:4px}.state{padding:4px 6px}
  .filters{margin-bottom:4px}.filters select,.filters input{height:33px}
  .card{height:125px;min-height:125px;padding:7px 9px}.source{display:none}.opener{font-size:clamp(17px,5.1vw,20px);line-height:1.24;margin:4px 0}
  .primaryActions{margin-top:4px}.btn{height:36px;font-size:10px}.btn.primary{font-size:12px}
  .secondaryActions{margin-top:4px}.btn.utility{height:29px}
  .stats{margin-top:4px}.stat{padding:3px 2px}
  .tabs{margin-top:4px}.tab{height:29px}
}
</style>
</head>
<body>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<main class="app">
  <div class="top">
    <div class="brand"><b>פתיחות PRO</b><small id="contextLine">פתיחות טבעיות</small></div>
    <div class="topTools">
      <button id="refreshBtn" class="toolBtn" aria-label="רענן"><span class="refreshIcon">↻</span> רענן</button>
      <button id="shareBtn" class="toolBtn" aria-label="שתף">↗ שתף</button>
      <span class="version">FAST v12</span>
    </div>
  </div>

  <section class="hero">
    <div class="statusRow">
      <div class="bank"><strong id="bankCount">0</strong><span>פתיחות זמינות</span></div>
      <div class="state" id="syncState">מוכן</div>
    </div>

    <div id="freshCount" hidden>0 חדשים</div>

    <div class="filters">
      <select id="category" aria-label="קטגוריה">
        <option value="all">כל הסגנונות</option>
        <option value="קליל">קליל</option>
        <option value="מסקרן">מסקרן</option>
        <option value="עמוק">עמוק</option>
        <option value="מצחיק">מצחיק</option>
        <option value="רגעי">לפי הרגע</option>
      </select>
      <input id="search" placeholder="חיפוש..." aria-label="חיפוש במאגר">
    </div>

    <div class="card">
      <div class="meta"><span id="catLabel">קטגוריה</span><span class="counter" id="position">0 מתוך 0</span></div>
      <div id="opener" class="opener">טוען...</div>
      <div class="source"><span id="freshBadge" class="badge">חדש</span> <span id="source">ניסוח טבעי</span></div>
    </div>

    <div class="primaryActions">
      <button class="btn primary" id="nextBtn">הבא</button>
      <button class="btn reject" id="deleteBtn">🗑 לא להציג</button>
      <button class="btn fav" id="favBtn">★ מועדף</button>
    </div>

    <div class="secondaryActions">
      <button class="btn utility" id="copyBtn">העתק</button>
      <button class="btn utility" id="moreBtn">ערבב</button>
      <button class="btn utility" id="prevBtn">הקודם</button>
    </div>

    <div class="stats">
      <div class="stat"><b id="totalStat">0</b><span>במאגר</span></div>
      <div class="stat"><b id="favStat">0</b><span>מועדפים</span></div>
      <div class="stat"><b id="deletedStat">0</b><span>חסומים</span></div>
      <div class="stat"><b id="seenStat">0</b><span>נראו</span></div>
    </div>
  </section>

  <div class="tabs">
    <button class="tab active" data-tab="history">אחרונות</button>
    <button class="tab" data-tab="favorites">מועדפים</button>
    <button class="tab" data-tab="deleted">חסומים</button>
  </div>
  <div id="panel" class="panel"></div>
  <div class="foot">מהיר, מקומי וללא API</div>
</main>
<script src="xt-engine.js?v=12"></script>
</body>
</html>
