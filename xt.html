<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080810">
<title>פתיחות PRO</title>
<style>
:root{--bg:#080810;--card:#12121d;--soft:#191927;--line:rgba(255,255,255,.09);--text:#f8f8fb;--muted:#9090a3;--pink:#ef476f;--orange:#ff9f43;--blue:#56ccf2;--green:#66d19e;--gold:#ffd166}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:radial-gradient(circle at 80% -10%,rgba(239,71,111,.16),transparent 30%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;padding:18px 14px 42px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.brand b{font-size:23px;background:linear-gradient(135deg,var(--pink),var(--orange));-webkit-background-clip:text;color:transparent}.brand small{display:block;color:var(--muted);margin-top:4px}.live{font-size:11px;border:1px solid rgba(102,209,158,.25);color:var(--green);background:rgba(102,209,158,.07);padding:8px 10px;border-radius:999px}.hero{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015));border-radius:24px;padding:16px;box-shadow:0 18px 55px rgba(0,0,0,.3)}.freshbar{display:flex;justify-content:space-between;gap:10px;align-items:center;background:rgba(86,204,242,.08);border:1px solid rgba(86,204,242,.2);border-radius:15px;padding:10px 12px;margin-bottom:9px;color:#e1f8ff;font-size:13px}.freshbar strong{color:var(--blue)}.sync{display:flex;justify-content:space-between;gap:8px;align-items:center;color:var(--muted);font-size:11px;margin:0 2px 12px}.sync button{border:1px solid var(--line);background:var(--soft);color:white;border-radius:10px;padding:7px 10px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.filters select,.filters input{width:100%;border:1px solid var(--line);background:#0e0e17;color:white;border-radius:13px;padding:11px 12px;outline:none}.card{min-height:245px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;justify-content:space-between}.meta{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted)}.counter{font-weight:900;color:white;font-size:13px}.opener{font-size:27px;line-height:1.58;text-align:center;font-weight:760;margin:24px 4px}.source{text-align:center;color:var(--muted);font-size:11px}.badge{display:inline-block;border-radius:999px;padding:3px 7px;font-size:10px;background:rgba(102,209,158,.08);color:var(--green);border:1px solid rgba(102,209,158,.2)}.actions{display:grid;grid-template-columns:52px 1.5fr 1.3fr 52px 52px;gap:8px;margin-top:10px}.btn{border:1px solid var(--line);background:var(--soft);color:white;border-radius:14px;padding:13px 8px;font-weight:750}.btn.primary{background:linear-gradient(135deg,var(--pink),#b92f50);border:0}.btn.fav.active{color:var(--gold);border-color:rgba(255,209,102,.34);background:rgba(255,209,102,.08)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.stat{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:10px}.stat b{display:block;font-size:18px}.stat span{font-size:10px;color:var(--muted)}.tabs{display:flex;gap:8px;overflow:auto;margin-top:18px}.tab{white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:8px 12px}.tab.active{background:var(--soft);color:white}.panel{margin-top:10px;display:grid;gap:8px}.row{display:flex;gap:8px;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:13px;padding:10px}.rowtext{flex:1;line-height:1.45}.mini{border:1px solid var(--line);background:#0d0d15;color:white;border-radius:9px;padding:7px 9px}.empty{text-align:center;color:var(--muted);padding:20px}.foot{font-size:11px;color:var(--muted);text-align:center;line-height:1.65;margin-top:15px}
@media(max-width:560px){
html,body{height:100%;overflow:hidden}
body{min-height:100%;background:var(--bg)}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.app{height:100dvh;max-height:100dvh;padding:max(7px,env(safe-area-inset-top)) 8px max(7px,env(safe-area-inset-bottom));display:flex;flex-direction:column;overflow:hidden}
.top{margin-bottom:5px;gap:6px;flex:0 0 auto}.brand b{font-size:19px}.brand small{font-size:10px;margin-top:1px}.live{font-size:9px;padding:5px 7px}
.hero{padding:8px;border-radius:16px;box-shadow:none;flex:0 0 auto}
.freshbar{padding:6px 8px;margin-bottom:5px;border-radius:10px;font-size:11px;min-height:30px}
#freshRow{display:none}
.sync{margin:0 0 5px;display:grid;grid-template-columns:1fr auto;align-items:center;font-size:10px}.sync button{padding:5px 8px;min-height:30px;border-radius:9px}
.filters{grid-template-columns:1fr 1fr;gap:5px;margin-bottom:6px}.filters select,.filters input{padding:6px 8px;border-radius:9px;font-size:16px;height:36px}
.card{min-height:142px;height:142px;border-radius:15px;padding:9px 11px}.meta{font-size:10px}.counter{font-size:11px}
.opener{font-size:clamp(18px,5.5vw,22px);line-height:1.32;margin:7px 0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.source{font-size:9px}.badge{font-size:8px;padding:2px 5px}
.actions{grid-template-columns:40px 1.25fr 1fr 40px 40px;gap:5px;margin-top:6px}.btn{height:40px;padding:0 5px;border-radius:10px;font-size:13px}
.stats{grid-template-columns:repeat(4,1fr);gap:5px;margin-top:6px}.stat{padding:5px 3px;border-radius:9px;text-align:center}.stat b{font-size:14px}.stat span{font-size:8px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:6px;overflow:visible;flex:0 0 auto}.tab{padding:6px 4px;font-size:11px}
.panel{flex:1;min-height:0;overflow-y:auto;margin-top:5px;gap:4px;-webkit-overflow-scrolling:touch}.row{padding:6px 7px;border-radius:9px;font-size:11px;gap:5px}.mini{padding:5px 6px;font-size:10px}.empty{padding:8px;font-size:11px}
.foot{display:none}
}
@media(max-width:560px) and (max-height:700px){
.app{padding-top:max(5px,env(safe-area-inset-top));padding-bottom:max(5px,env(safe-area-inset-bottom))}
.top{margin-bottom:3px}.brand small{display:none}.live{padding:4px 6px}
.freshbar{min-height:26px;padding:4px 7px;margin-bottom:4px}
.sync{margin-bottom:4px}.sync button{min-height:27px;padding:3px 7px}
.filters{margin-bottom:4px}.filters select,.filters input{height:33px;padding:4px 7px}
.card{height:124px;min-height:124px;padding:7px 9px}.opener{font-size:clamp(17px,5.2vw,20px);margin:4px 0;line-height:1.25}.source{display:none}
.actions{margin-top:4px}.btn{height:36px}.stats{margin-top:4px}.stat{padding:3px 2px}.stat b{font-size:13px}.stat span{font-size:7px}
.tabs{margin-top:4px}.tab{padding:5px 3px}.panel{margin-top:3px}
}
</style>
</head>
<body><main class="app">
<div class="top"><div class="brand"><b>פתיחות PRO</b><small id="contextLine">מנוע FREE חכם</small></div><div class="live">FREE · FAST v11</div></div>
<section class="hero">
<div class="freshbar" id="bankRow"><span>סה״כ פתיחות</span><strong id="bankCount">0 פתיחות</strong></div><div class="freshbar" id="freshRow"><span>נוספו בטעינה הזאת</span><strong id="freshCount">0 חדשים</strong></div>
<div class="sync"><span id="syncState">FREE · ללא API</span><button id="moreBtn">ערבב והצג חדש</button></div>
<div class="filters"><select id="category"><option value="all">הכול</option><option value="קליל">קליל</option><option value="מסקרן">מסקרן</option><option value="עמוק">עמוק</option><option value="מצחיק">מצחיק</option><option value="רגעי">לפי הרגע</option></select><input id="search" placeholder="חפש במאגר..." /></div>
<div class="card"><div class="meta"><span id="catLabel">קטגוריה</span><span class="counter" id="position">0 מתוך 0</span></div><div id="opener" class="opener">טוען...</div><div class="source"><span id="freshBadge" class="badge">חדש</span> <span id="source">טוען מקור...</span></div></div>
<div class="actions"><button class="btn" id="prevBtn">‹</button><button class="btn primary" id="nextBtn">הבא</button><button class="btn" id="copyBtn">העתק</button><button class="btn fav" id="favBtn">★</button><button class="btn" id="deleteBtn">🗑</button></div>
<div class="stats"><div class="stat"><b id="totalStat">0</b><span>במאגר</span></div><div class="stat"><b id="favStat">0</b><span>מועדפים</span></div><div class="stat"><b id="deletedStat">0</b><span>חסומים</span></div><div class="stat"><b id="seenStat">0</b><span>נראו</span></div></div>
</section>
<div class="tabs"><button class="tab active" data-tab="history">אחרונות</button><button class="tab" data-tab="favorites">מועדפים</button><button class="tab" data-tab="deleted">חסומים</button></div><div id="panel" class="panel"></div>
<div class="foot">גרסת FAST: מותאמת לאייפון, נטענת מהר יותר ושומרת את כל הפעולות המרכזיות במסך אחד. כל פתיחה מכילה לכל היותר שאלה אחת.</div>
</main>
<script src="xt-engine.js?v=11"></script>
</body></html>
