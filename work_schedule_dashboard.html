<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1220">
<title>WORK SCHEDULE · AST</title>
<link rel="stylesheet" href="work_schedule_dashboard.css?v=1.4.0">
</head>
<body>
<div class="app">
  <div class="header">
    <div>
      <h1>WORK SCHEDULE</h1>
      <div class="headerMeta">מחלקת AST · סוג משמרת ב׳ · PRO v1.4.0</div>
    </div>
    <div class="range" id="rangeText"></div>
  </div>

  <section class="card">
    <div class="sectionTitle"><b>טווח תאריכים</b><small>מתאריך עד תאריך</small></div>
    <div class="periodBar">
      <button type="button" class="nav" id="nextRange">›</button>
      <input class="date" id="rangeStart" type="date">
      <input class="date" id="rangeEnd" type="date">
      <button type="button" class="nav" id="prevRange">‹</button>
    </div>
    <div class="inlineMeta" id="rangeMeta"></div>
    <div class="quickTop">
      <button type="button" class="topBtn" id="resetHiddenBtn">הצג את כל הימים</button>
      <button type="button" class="topBtn red" id="toggleHideDayBtn">הסתר יום נבחר</button>
    </div>
  </section>

  <section class="card">
    <div class="sectionTitle"><b>ימי עבודה</b><small>לחץ לבחירה</small></div>
    <div class="days" id="days"></div>
  </section>

  <section class="card">
    <div class="sectionTitle"><b>תצוגת שיבוץ בזמן אמת</b><small>מתעדכן מיד</small></div>
    <div class="liveGrid" id="liveGrid"></div>
  </section>

  <section class="card">
    <div class="sectionTitle"><b id="assignTitle">שיבוץ עובדים</b><small id="assignCount"></small></div>
    <div class="people" id="people"></div>
    <div class="quickActions">
      <button type="button" class="sm green" id="allDayBtn">כולם</button>
      <button type="button" class="sm red" id="clearDayBtn">נקה יום</button>
      <button type="button" class="sm" id="copyDayBtn">העתק יום</button>
      <button type="button" class="sm" id="resetHiddenBtnBottom">בטל הסתרות</button>
    </div>
  </section>

  <section class="card">
    <div class="sectionTitle"><b id="dayNoteTitle">הערה ליום</b><small>אופציונלי</small></div>
    <textarea class="noteArea" id="dayNoteInput" placeholder="הערה כללית ליום"></textarea>
  </section>

  <section class="card">
    <button type="button" class="manageBtn" id="manageBtn">ניהול עובדים</button>
  </section>

  <canvas id="reportCanvas" class="preview" width="1080" height="1800"></canvas>
</div>

<div class="sticky"><div class="stickyInner">
  <button type="button" class="big primary" id="shareBtn">שתף תמונה לוואטסאפ</button>
  <button type="button" class="big secondary" id="saveBtn">שמור PNG</button>
</div></div>

<div class="sheet" id="workerSheet">
  <div class="sheetBox">
    <h3 id="workerSheetTitle">שעות והערה</h3>
    <div class="formGrid">
      <input id="workerFrom" type="time">
      <input id="workerTo" type="time">
      <textarea id="workerNote" placeholder="הערה לעובד ביום הזה"></textarea>
    </div>
    <div class="sheetBtns">
      <button type="button" class="save" id="saveWorkerDay">שמור</button>
      <button type="button" class="cancel" id="cancelWorkerDay">ביטול</button>
    </div>
  </div>
</div>

<div class="sheet" id="manageSheet">
  <div class="sheetBox">
    <h3>ניהול עובדים</h3>
    <div class="addRow">
      <input id="newName" placeholder="שם עובד" autocomplete="off">
      <input id="newFrom" type="time" value="16:30">
      <input id="newTo" type="time" value="22:00">
      <button type="button" id="addWorkerBtn">+ הוסף</button>
    </div>
    <div class="manageList" id="manageList"></div>
    <div class="sheetBtns">
      <button type="button" class="save" id="closeManage">סיום</button>
      <button type="button" class="cancel" id="resetData">איפוס הכל</button>
    </div>
  </div>
</div>

<div class="sheet" id="copySheet">
  <div class="sheetBox">
    <h3>העתק את היום ל...</h3>
    <div class="days" id="copyDays"></div>
    <div class="sheetBtns">
      <button type="button" class="cancel" id="closeCopy" style="grid-column:1/-1">ביטול</button>
    </div>
  </div>
</div>

<script src="work_schedule_core.js?v=1.4.0"></script>
<script src="work_schedule_report.js?v=1.4.0"></script>
</body>
</html>
