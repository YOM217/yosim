<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Production Flow</title>
</head>
<body>
<script>
(async()=>{
  const files=['assets/bds217_part1.txt','assets/bds217_part2.txt','assets/bds217_part3.txt','assets/bds217_part4.txt'];
  const parts=await Promise.all(files.map(async f=>{
    const r=await fetch(f,{cache:'no-store'});
    if(!r.ok) throw new Error(f+' '+r.status);
    return (await r.text()).trim();
  }));
  const bin=atob(parts.join(''));
  const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
  const html=new TextDecoder('utf-8').decode(bytes);
  document.open();
  document.write(html);
  document.close();
})().catch(e=>{
  document.body.innerHTML='<div style="font-family:-apple-system;padding:24px">טעינת הקובץ נכשלה. נסה לרענן.</div>';
  console.error(e);
});
</script>
</body>
</html>
