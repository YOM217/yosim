<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1220">
<title>Production Flow 2.48</title>
</head>
<body style="margin:0;background:#07111f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
<div id="loading" style="padding:24px;text-align:center">Loading Production Flow 2.48…</div>
<script>
(async()=>{
  try{
    const files=['assets/v248_gz_part1.txt','assets/v248_gz_part2.txt'];
    const parts=await Promise.all(files.map(async f=>{
      const r=await fetch(f,{cache:'no-store'});
      if(!r.ok) throw new Error(f+' '+r.status);
      return (await r.text()).trim();
    }));
    const bin=atob(parts.join(''));
    const compressed=Uint8Array.from(bin,c=>c.charCodeAt(0));
    if(typeof DecompressionStream!=='function') throw new Error('DecompressionStream unsupported');
    const ds=new DecompressionStream('gzip');
    const stream=new Blob([compressed]).stream().pipeThrough(ds);
    const html=await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    console.error(e);
    document.getElementById('loading').innerHTML='<div style="padding:20px"><strong>Loading error</strong><br><small>Please refresh the page.</small></div>';
  }
})();
</script>
</body>
</html>
